name: Price Sync

on:
  # Run daily at 6 AM UTC (8 AM Bulgarian time)
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'validate'
        type: choice
        options:
          - validate   # Just check prices, don't update
          - sync       # Check and update prices
          - full-sync  # Full sync with Shopify export

      sample_size:
        description: 'Number of products to check (0 = all)'
        required: false
        default: '100'
        type: string

jobs:
  price-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run price validation
        if: github.event.inputs.mode == 'validate' || github.event_name == 'schedule'
        run: |
          sample_size="${{ github.event.inputs.sample_size || '100' }}"
          if [ "$sample_size" = "0" ]; then
            python scripts/price_validator.py --full --delay 1.0 --output data/price_validation
          else
            python scripts/price_validator.py --sample "$sample_size" --delay 0.5 --output data/price_validation
          fi

      - name: Run price sync (dry-run on schedule)
        if: github.event.inputs.mode == 'sync'
        run: |
          sample_size="${{ github.event.inputs.sample_size || '100' }}"
          if [ "$sample_size" = "0" ]; then
            python scripts/price_sync.py --full --delay 1.0
          else
            python scripts/price_sync.py --sample "$sample_size" --delay 0.5
          fi

      - name: Run full sync with Shopify export
        if: github.event.inputs.mode == 'full-sync'
        run: |
          python scripts/price_sync.py --full --delay 1.0 --shopify-export

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: price-validation-report
          path: data/price_validation/
          retention-days: 30

      - name: Upload sync results
        if: github.event.inputs.mode == 'sync' || github.event.inputs.mode == 'full-sync'
        uses: actions/upload-artifact@v4
        with:
          name: price-sync-results
          path: data/price_sync/
          retention-days: 30

      - name: Create PR with price updates
        if: github.event.inputs.mode == 'sync' || github.event.inputs.mode == 'full-sync'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Update product prices from benu.bg"
          title: "Price Update: Sync from benu.bg"
          body: |
            Automated price sync from benu.bg.

            See the attached artifacts for:
            - Update log with all price changes
            - Shopify import CSV (if full-sync mode)
            - Error report for any failed fetches

            Please review the changes before merging.
          branch: automated/price-sync
          delete-branch: true
          labels: |
            automated
            prices

      - name: Reload ChromaDB via API
        if: github.event.inputs.mode == 'sync' || github.event.inputs.mode == 'full-sync'
        env:
          API_URL: ${{ secrets.VIAPHARMA_API_URL }}
          RELOAD_API_KEY: ${{ secrets.VIAPHARMA_RELOAD_API_KEY }}
        run: |
          echo "Triggering ChromaDB reload on the production API..."
          HTTP_STATUS=$(curl -s -o /tmp/reload_response.json -w "%{http_code}" \
            -X POST "${API_URL}/admin/reload" \
            -H "Authorization: Bearer ${RELOAD_API_KEY}" \
            -H "Content-Type: application/json")
          cat /tmp/reload_response.json
          if [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::ChromaDB reload failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Reload accepted. Poll ${API_URL}/health for products_count to confirm."

      - name: Check for significant mismatches
        if: github.event_name == 'schedule'
        run: |
          # Parse the latest report and fail if mismatch rate is high
          REPORT=$(ls -t data/price_validation/report_*.txt | head -1)
          if grep -q "WARNING:" "$REPORT"; then
            echo "::warning::High price mismatch rate detected!"
            cat "$REPORT"
            exit 1
          fi
